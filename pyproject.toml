[project]
name = "zalo-ai-dlus"
version = "0.1.0"
description = "Zalo AI Challenge submission (refactored)."
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy==1.26.4",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "Cython==3.2.2",
  "opencv-python==4.10.0.84",
  "Pillow==10.2.0",
  "ultralytics==8.2.0",
  "transformers==4.40.0",
  "timm==0.9.16",
  "safetensors==0.4.2",
  "scipy==1.12.0",
  "albumentations==1.4.0",
  "scikit-learn==1.4.0",
  "PyYAML==6.0.1",
  "tqdm==4.66.2",
  "matplotlib==3.8.3",
  "seaborn==0.13.2",
  "tensorboard==2.15.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
